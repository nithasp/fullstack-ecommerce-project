<div class="payment-dialog-overlay" [class.payment-dialog-overlay--closing]="closing" (click)="close()"
  (animationend)="onOverlayAnimationDone($event)">
  <div class="payment-dialog" [class.payment-dialog--closing]="closing" (click)="$event.stopPropagation()">

    <div class="payment-dialog__header">
      <h2 class="payment-dialog__title">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="18" height="18"
          aria-hidden="true">
          <path fill-rule="evenodd"
            d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
            clip-rule="evenodd" />
        </svg>
        Secure Card Payment
      </h2>
      <button class="payment-dialog__close" (click)="close()" aria-label="Close" [disabled]="isProcessing">&times;</button>
    </div>

    <div class="payment-dialog__body">
      <div class="payment-dialog__summary">
        <span class="payment-dialog__summary-label">Order #{{ orderId }}</span>
        <span class="payment-dialog__summary-amount">${{ displayAmount | number:'1.2-2' }}</span>
      </div>

      <div class="payment-dialog__loading" *ngIf="isLoadingForm && !loadError">
        <app-loading-spinner message="Loading secure payment form…" layout="block"></app-loading-spinner>
      </div>

      <p class="payment-dialog__load-error" *ngIf="loadError">{{ loadError }}</p>

      <div #paymentElementHost class="payment-dialog__element"
        [class.payment-dialog__element--hidden]="isLoadingForm || loadError"></div>

      <p class="payment-dialog__error" *ngIf="errorMessage">{{ errorMessage }}</p>
    </div>

    <div class="payment-dialog__footer">
      <button type="button" class="payment-dialog__cancel" (click)="close()" [disabled]="isProcessing">Cancel</button>
      <button type="button" class="payment-dialog__pay" (click)="pay()"
        [disabled]="isProcessing || isLoadingForm || !!loadError">
        <span *ngIf="isProcessing" class="payment-dialog__pay-spinner" aria-hidden="true"></span>
        {{ isProcessing ? 'Processing…' : 'Pay $' + (displayAmount | number:'1.2-2') }}
      </button>
    </div>

    <p class="payment-dialog__secure-note">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="12" height="12"
        aria-hidden="true">
        <path fill-rule="evenodd"
          d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
          clip-rule="evenodd" />
      </svg>
      Encrypted and processed securely by Stripe. Card details never touch our servers.
    </p>

  </div>
</div>
