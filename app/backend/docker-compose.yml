name: fullstack-ecommerce-project

services:
  postgres:
    image: postgres:17-alpine
    container_name: storefront-postgres
    restart: always
    environment:
      POSTGRES_USER: storefront_user
      POSTGRES_PASSWORD: storefront_pass
      POSTGRES_DB: storefront_dev
    ports:
      # Published to this machine only, so the database is not reachable from the local network
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres17_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U storefront_user -d storefront_dev']
      interval: 15s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: storefront-adminer
    restart: always
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres17_data:
