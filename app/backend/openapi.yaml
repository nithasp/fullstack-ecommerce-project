        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - name: userId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: One page of orders.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
