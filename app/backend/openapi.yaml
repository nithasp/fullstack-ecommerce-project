  # ── Admin · Audit Logs ──────────────────────────────────────────────────────

  /api/v1/admin/audit-logs:
    get:
      tags: [Admin · Audit Logs]
      summary: List audit-log entries
      description: |
        Newest first, paginated and optionally filtered. Each entry is one request by a
        signed-in user, one auth event, or one frontend page a user opened. Its type comes
        from the HTTP method — `GET` is `READ`, `POST` is `CREATE`, `PUT` is `UPDATE`,
        `DELETE` is `DELETE` — except for the auth events and `PAGE_VIEW`, which have types
        of their own.

        The log is read-only: no route edits or deletes an entry, and reading the log is not
        itself recorded. Entries older than `AUDIT_LOG_RETENTION_DAYS` (default 90) are
        deleted by the server.
      operationId: adminListAuditLogs
      parameters:
        - name: userId
          in: query
          required: false
          description: Only this user's entries.
          schema: { type: integer, minimum: 1 }
        - name: username
          in: query
          required: false
          description: Only entries whose username contains this text, ignoring letter case.
          schema: { type: string, maxLength: 100 }
        - name: action
          in: query
          required: false
          description: |
            One or more types, comma-separated, in any letter case. Until they are switched
            on, the admin page hides page views and API reads by sending every type except
            `PAGE_VIEW` and `READ`.
          schema: { type: string, example: 'LOGIN,LOGIN_FAILED' }
        - name: result
          in: query
          required: false
          description: '`success` is any status below 400; `failure` is 400 and above.'
          schema: { type: string, enum: [success, failure] }
        - name: from
          in: query
          required: false
          description: Only entries at or after this moment (ISO 8601).
          schema: { type: string, format: date-time, example: '2026-09-01T00:00:00Z' }
        - name: to
          in: query
          required: false
          description: Only entries before this moment (ISO 8601) — exclusive, so a day ends where the next begins.
          schema: { type: string, format: date-time, example: '2026-09-02T00:00:00Z' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of entries, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Audit logs fetched. }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AuditLog' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '400':
          description: An unknown type or result, or a value that is not a date.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              example:
                status: 400
                message: 'result must be one of: success, failure'
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Page Views ──────────────────────────────────────────────────────────────

  /api/v1/page-views:
    post:
      tags: [Page Views]
      summary: Report a page the user opened
      description: |
        The frontend calls this after each navigation. The report becomes one `PAGE_VIEW`
        entry in the audit log for the token user, with the page's path in place of the API
        route and no HTTP method. Page views are reported by the browser, so unlike the API
        entries they can be left out or made up by the client.

        A refused report (`400`) is recorded as `page.view_rejected`.
      operationId: recordPageView
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  maxLength: 255
                  pattern: '^/[^\s?#]*$'
                  description: The page's path, without a query string or fragment.
                  example: /products/5
                page:
                  type: string
                  maxLength: 60
                  description: A readable name for the page, shown in the Activity Log.
                  example: Product detail
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      status: { type: integer, example: 201 }
                      message: { type: string, example: Page view recorded. }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The `accessToken` from `POST /auth/register`, `POST /auth/login` or
        `POST /auth/refresh`, sent as `Authorization: Bearer <accessToken>`.
        Expires after 15 minutes by default.

  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: User id.
      schema: { type: integer, minimum: 1 }
      example: 1
    UserIdPath:
      name: userId
      in: path
      required: true
      description: User id.
      schema: { type: integer, minimum: 1 }
      example: 1
    ProductId:
      name: id
      in: path
      required: true
      description: Product id.
      schema: { type: integer, minimum: 1 }
      example: 1
    OrderId:
      name: id
      in: path
      required: true
      description: Order id.
      schema: { type: integer, minimum: 1 }
      example: 1
    CartItemId:
      name: id
      in: path
      required: true
      description: Cart item id.
      schema: { type: integer, minimum: 1 }
      example: 1
    AddressId:
      name: id
      in: path
      required: true
      description: Address id.
      schema: { type: integer, minimum: 1 }
      example: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Bounded so one request cannot pull a whole table.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      description: Rows to skip.
      schema:
        type: integer
        minimum: 0
        default: 0

  schemas:

    Envelope:
      type: object
      description: |
        The shape every route except `GET /` returns. `status` repeats the HTTP status code;
        `data` is `null` on errors.
      required: [status, message, data]
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Products fetched.
        data:
          description: |
            The payload, or `null`. Left untyped because it varies by route — an object,
            an array, or `null`."

    PageMeta:
      type: object
      description: |
        Sent next to `data` on every paginated list. `total` counts all matching rows, so
        there are more pages while `offset + data.length < total`.
      required: [limit, offset, total]
      properties:
        limit: { type: integer, example: 50 }
        offset: { type: integer, example: 0 }
        total: { type: integer, example: 134 }

    TokenError:
      type: object
      description: |
        Returned by the auth middleware instead of the envelope, so a frontend can tell a
        recoverable expiry from a dead session.
      required: [error, code]
      properties:
        error:
          type: string
          example: Access token has expired.
        code:
          type: string
          enum: [no_token, token_expired, token_invalid]
          example: token_expired

    RateLimitError:
      type: object
      description: |
        Returned by the auth-route limiter. Same `error`/`code` shape as `TokenError`, but a
        different code — the global limiter, by contrast, answers with the envelope.
      required: [error, code]
      properties:
        error:
          type: string
          example: Too many requests. Please wait a moment and try again.
        code:
          type: string
          enum: [rate_limited]

    UserRole:
      type: string
      enum: [customer, admin]
      default: customer

    OrderStatus:
      type: string
      enum: [active, complete]

    AddressLabel:
      type: string
      enum: [home, work, other]
      default: home

    User:
      type: object
      description: |
        An account. The password hash is never selected from the database, so no password
        field is ever returned.
      properties:
        id: { type: integer, example: 1 }
        firstName: { type: string, example: John }
        lastName: { type: string, example: Doe }
        username: { type: string, example: johndoe }
        role: { $ref: '#/components/schemas/UserRole' }

    UserWithPurchases:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            recentPurchases:
              type: array
              description: Up to 5 line items from the user's most recent completed orders.
              items: { $ref: '#/components/schemas/RecentPurchase' }

    UserUpdate:
      type: object
      description: At least one property is required.
      minProperties: 1
      properties:
        firstName: { type: string, example: Jane }
        lastName: { type: string, example: Doe }
        username: { type: string, example: janedoe }
        password:
          type: string
          format: password
          minLength: 8
          description: Stored exactly as sent; surrounding spaces are not trimmed.

    RecentPurchase:
      type: object
      properties:
        productId: { type: integer, example: 1 }
        name: { type: string, example: Keyboard }
        price:
          type: string
          description: |
            `NUMERIC(10,2)`, returned by the driver as a string to preserve precision.
          example: '49.99'
        category: { type: string, nullable: true, example: Electronics }
        image: { type: string, nullable: true }
        description: { type: string, nullable: true }
        quantity: { type: integer, example: 2 }
        orderId: { type: integer, example: 7 }

    AuthSession:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken:
          type: string
          description: JWT, valid for 15 minutes by default.
        refreshToken:
          type: string
          description: Opaque token, valid for 7 days, rotated on every refresh.

    ProductType:
      type: object
      description: A purchasable variant of a product, such as a colourway.
      properties:
        _id: { type: string }
        productId: { type: integer }
        color: { type: string, example: Black }
        quantity: { type: integer }
        price: { type: number, format: float, example: 49.99 }
        stock: { type: integer, example: 12 }
        image: { type: string }

    Review:
      type: object
      properties:
        _id: { type: string }
        star: { type: number, example: 5 }
        comment: { type: string, example: Works great. }
        userId: { type: string }
        userName: { type: string, example: johndoe }
        date: { type: string, example: '2026-05-01' }

    Product:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Keyboard }
        price:
          type: string
          description: |
            `NUMERIC(10,2)`, returned by the driver as a string to preserve precision —
            parse it client-side before doing arithmetic.
          example: '49.99'
        category: { type: string, nullable: true, example: Electronics }
        image: { type: string, nullable: true }
        description: { type: string, nullable: true }
        previewImg:
          type: array
          items: { type: string }
        types:
          type: array
          items: { $ref: '#/components/schemas/ProductType' }
        reviews:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        overallRating:
          type: number
          format: float
          nullable: true
          description: Omitted when 0 or unset.
          example: 4.5
        stock: { type: integer, example: 25 }
        isActive: { type: boolean, default: true }
        shopId: { type: string, nullable: true }
        shopName: { type: string, nullable: true }

    ProductCreate:
      type: object
      required: [name, price]
      properties:
        name: { type: string, minLength: 1, example: Keyboard }
        price:
          type: number
          format: float
          minimum: 0
          example: 49.99
        category: { type: string, example: Electronics }
        image: { type: string }
        description: { type: string }
        previewImg:
          type: array
          items: { type: string }
        types:
          type: array
          items: { $ref: '#/components/schemas/ProductType' }
        reviews:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        overallRating: { type: number, format: float, example: 4.5 }
        stock: { type: integer, example: 25 }
        isActive: { type: boolean, default: true }
        shopId: { type: string }
        shopName: { type: string }

    ProductUpdate:
      type: object
      description: At least one property is required.
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        price: { type: number, format: float, minimum: 0 }
        category: { type: string }
        image: { type: string }
        description: { type: string }
        previewImg:
          type: array
          items: { type: string }
        types:
          type: array
          items: { $ref: '#/components/schemas/ProductType' }
        reviews:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        overallRating: { type: number, format: float }
        stock: { type: integer }
        isActive: { type: boolean }
        shopId: { type: string }
        shopName: { type: string }

    Order:
      type: object
      properties:
        id: { type: integer, example: 1 }
        userId: { type: integer, example: 1 }
        status: { $ref: '#/components/schemas/OrderStatus' }

    OrderProduct:
      type: object
      description: One line item on an order.
      properties:
        id: { type: integer, example: 1 }
        orderId: { type: integer, example: 1 }
        productId: { type: integer, example: 1 }
        quantity: { type: integer, example: 2 }

    CartItem:
      type: object
      description: |
        A cart item as returned by writes. Reads add the joined `product*` fields — see
        `CartItemWithProduct`.
      properties:
        id: { type: integer, example: 1 }
        userId: { type: integer, example: 1 }
        productId: { type: integer, example: 1 }
        quantity: { type: integer, example: 2 }
        typeId:
          type: string
          description: |
            Variant key. Empty string when the product has no variants; part of the
            uniqueness constraint, so two variants of one product are separate cart items.
          example: ''
        selectedType:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ProductType'
        shopId: { type: string, nullable: true }
        shopName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CartItemWithProduct:
      allOf:
        - $ref: '#/components/schemas/CartItem'
        - type: object
          description: The joined product columns, present only on reads.
          properties:
            productName: { type: string, example: Keyboard }
            productPrice: { type: string, example: '49.99' }
            productCategory: { type: string, nullable: true }
            productImage: { type: string, nullable: true }
            productDescription: { type: string, nullable: true }
            productPreviewImg:
              type: array
              items: { type: string }
            productTypes:
              type: array
              items: { $ref: '#/components/schemas/ProductType' }
            productReviews:
              type: array
              items: { $ref: '#/components/schemas/Review' }
            productOverallRating: { type: string, nullable: true, example: '4.5' }
            productStock: { type: integer }
            productIsActive: { type: boolean }
            productShopId: { type: string, nullable: true }
            productShopName: { type: string, nullable: true }

    CartItemUpsert:
      type: object
      required: [productId]
      properties:
        productId: { type: integer, minimum: 1, example: 1 }
        quantity:
          type: integer
          minimum: 1
          default: 1
          description: Added to the existing quantity when the item is already in the cart.
          example: 2
        typeId:
          type: string
          description: Variant key. Defaults to an empty string.
          example: ''
        selectedType:
          type: object
          nullable: true
          description: The chosen variant, stored as-is.
        shopId: { type: string, nullable: true }
        shopName: { type: string, nullable: true }

    Address:
      type: object
      properties:
        id: { type: integer, example: 1 }
        userId: { type: integer, example: 1 }
        fullName: { type: string, example: John Doe }
        phone: { type: string, nullable: true, example: '+62 812 3456 7890' }
        address: { type: string, example: 12 Market Street }
        city: { type: string, example: Jakarta }
        label: { $ref: '#/components/schemas/AddressLabel' }
        isDefault: { type: boolean, example: false }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AddressCreate:
      type: object
      required: [fullName, address, city]
      properties:
        fullName: { type: string, minLength: 1, example: John Doe }
        address: { type: string, minLength: 1, example: 12 Market Street }
        city: { type: string, minLength: 1, example: Jakarta }
        phone: { type: string, example: '+62 812 3456 7890' }
        label:
          allOf:
            - $ref: '#/components/schemas/AddressLabel'
          description: An unrecognised value falls back to `home`.
        isDefault:
          type: boolean
          default: false
          description: |
            When true, the flag is cleared on the user's other addresses.
            Accepts the string `"true"` as well as the boolean.

    AddressUpdate:
      type: object
      description: At least one property is required. Only the properties you send are written.
      minProperties: 1
      properties:
        fullName: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        city: { type: string, minLength: 1 }
        phone:
          type: string
          nullable: true
          description: '`null` or an empty string clears the stored phone.'
        label: { $ref: '#/components/schemas/AddressLabel' }
        isDefault: { type: boolean }

    AuditAction:
      type: string
      enum: [CREATE, READ, UPDATE, DELETE, LOGIN, LOGIN_FAILED, LOGOUT, REGISTER, SECURITY, PAGE_VIEW]
      description: |
        `CREATE`, `READ`, `UPDATE` and `DELETE` come from the HTTP method. `LOGIN`,
        `LOGIN_FAILED`, `LOGOUT` and `REGISTER` are auth events, `SECURITY` marks a
        replayed refresh token, and `PAGE_VIEW` is a frontend page the user opened.

    AuditLog:
      type: object
      description: |
        One recorded event. The username is copied into the entry when it is written, so
        the entry still names the user after the account is deleted. A failed login for a
        username that does not exist has `userId: null`.
      properties:
        id: { type: integer, example: 1042 }
        createdAt: { type: string, format: date-time }
        userId: { type: integer, nullable: true, example: 7 }
        username: { type: string, nullable: true, example: alice }
        userRole: { type: string, enum: [customer, admin], nullable: true, example: customer }
        action: { $ref: '#/components/schemas/AuditAction' }
        event:
          type: string
          description: A readable name for what happened, as `resource.what_happened`.
          example: cart.item_added
        method:
          type: string
          nullable: true
          description: The HTTP method; `null` for a page view.
          example: POST
        path:
          type: string
          nullable: true
          description: The request path, without its query string. For a page view, the page's own path, e.g. `/products/5`.
          example: /api/v1/cart
        statusCode: { type: integer, nullable: true, example: 201 }
        ipAddress: { type: string, nullable: true, example: 203.0.113.5 }
        userAgent: { type: string, nullable: true, example: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' }
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            Small, non-secret facts: ids, quantities, a status, or for an update the names of
            the fields that changed (never their values).
          example: { productId: 5, quantity: 2 }

  responses:

    BadRequest:
      description: |
        Validation failed. `message` names the offending field, e.g.
        `price must be a non-negative number` or `user id must be a valid positive integer`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example:
            status: 400
            message: name is required and must be a non-empty string
            data: null

    Unauthorized:
      description: |
        The access token is missing, expired or invalid. Note this uses the `TokenError`
        shape, not the envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TokenError' }
          examples:
            missing:
              summary: No Authorization header
              value: { error: Access denied. No token provided., code: no_token }
            expired:
              summary: Expired — refresh and retry
              value: { error: Access token has expired., code: token_expired }
            invalid:
              summary: Malformed or wrongly signed
              value: { error: Invalid token., code: token_invalid }

    Forbidden:
      description: The token is valid but the record belongs to another user.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example: { status: 403, message: You can only access your own data, data: null }

    AdminRequired:
      description: |
        The token is valid but the account is not an admin. The role is read from the
        database on every request, so a just-demoted admin is refused immediately.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example: { status: 403, message: Admin access required, data: null }

    NotFound:
      description: No such record.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example: { status: 404, message: product with id 99 not found, data: null }

    NotFoundOrNotYours:
      description: |
        No such record — **or** it belongs to another user. The two cases are deliberately
        indistinguishable so the API does not confirm that someone else's record exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example: { status: 404, message: order with id 99 not found, data: null }

    PayloadTooLarge:
      description: The JSON body exceeded `JSON_BODY_LIMIT` (default `1mb`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example: { status: 413, message: Request body is too large, data: null }

    AuthRateLimited:
      description: |
        More than 20 requests to `/auth/register`, `/auth/login` or `/auth/refresh` from one
        IP in 15 minutes. This limiter answers with `error`/`code`, unlike the global limiter,
        which uses the envelope.
      headers:
        RateLimit-Limit:
          schema: { type: integer }
          description: Requests allowed in the window.
        RateLimit-Remaining:
          schema: { type: integer }
          description: Requests left in the window.
        RateLimit-Reset:
          schema: { type: integer }
          description: Seconds until the window resets.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RateLimitError' }
          example:
            error: Too many requests. Please wait a moment and try again.
            code: rate_limited

    InternalError:
      description: |
        Something failed server-side. The real error is logged; the response is deliberately
        opaque so stack traces, SQL and internal paths never reach a client.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example: { status: 500, message: Internal Server Error, data: null }
