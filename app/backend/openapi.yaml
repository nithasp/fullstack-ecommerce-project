openapi: 3.0.3

info:
  title: Storefront API
  version: 1.0.0
  description: |
    REST API for the storefront backend — accounts, catalog, cart, checkout, orders,
    shipping addresses and an admin namespace.

    ## Base path

    Every API route is served under `/api/v1`, e.g. `POST /api/v1/auth/login`. The prose
    below leaves the prefix out. Only `GET /` (health check), `GET /docs` and
    `GET /openapi.yaml` sit at the server root.

    ## Response envelope

    Every route except `GET /` wraps its payload in the same envelope:

    ```json
    { "status": 200, "message": "Products fetched.", "data": [] }
    ```

    `status` repeats the HTTP status code and `data` is `null` on errors. An error adds a
    machine-readable `code`:

    ```json
    { "status": 401, "message": "Access token has expired.", "data": null, "code": "token_expired" }
    ```

    `code` is one of `invalid_request`, `bad_request`, `no_token`, `token_expired`,
    `token_invalid`, `invalid_credentials`, `forbidden`, `not_found`, `conflict`,
    `rate_limited` or `internal_error`.

    ## Pagination

    Lists that can grow — products, orders and the admin lists — take `limit`
    (1–100, default 50) and `offset` (default 0), and add a `meta` object next to `data`:

    ```json
    { "status": 200, "message": "Products fetched.", "data": [], "meta": { "limit": 50, "offset": 0, "total": 134 } }
    ```

    ## Authentication

    All routes except `GET /`, `POST /auth/register`, `POST /auth/login`,
    `POST /auth/refresh` and `POST /auth/logout` require an access token:

    ```
    Authorization: Bearer <accessToken>
    ```

    Access tokens are HS256-signed JWTs (a token signed with any other algorithm is
    rejected) that expire after 15 minutes (`ACCESS_TOKEN_EXPIRY`).

    The **refresh token is never in the response body**. `POST /auth/register`,
    `POST /auth/login`, `POST /auth/refresh` and `PUT /users/{id}/password` set it as a
    cookie that JavaScript cannot read:

    ```
    Set-Cookie: refreshToken=…; HttpOnly; SameSite=Strict; Path=/api/v1/auth; Max-Age=604800
    ```

    Browser clients therefore send those requests with credentials (`withCredentials`), and
    the API must be on the same site as the page for a `SameSite=Strict` cookie to travel.
    Refresh tokens last 7 days (`REFRESH_TOKEN_EXPIRY_DAYS`) and rotate on every
    `POST /auth/refresh`: the token sent is invalidated as soon as it is exchanged, and
    presenting it again revokes that whole session.

    Ending a session everywhere — `POST /auth/logout-all`, a password change, an admin
    password reset, a role change or closing an account — deletes every refresh token of
    that account. Access tokens cannot be revoked, so they stay valid until they expire.

    ## Roles

    Every account has a `role` of `customer` (default) or `admin`.

    - Self-registration always creates a `customer`; a `role` in the register body is ignored.
      Admins are made with `npm run seed:admin`, `POST /admin/users` or
      `PUT /admin/users/{id}/role`.
    - Customer routes serve the token's own account only — another account's id answers
      `403` (users, addresses) or `404` (orders and cart items, so their existence is never
      revealed). This holds for an admin's token too: cross-account work belongs to `/admin`.
    - Admin routes re-read the role from the database on every request, so a demoted or
      closed admin loses access at once rather than when their token expires.

    ## Orders

    Checkout is the only way a customer creates an order, and orders are read-only for
    customers afterwards. `POST /cart/checkout` charges the cart rows it is given: it takes
    the quantity from the cart, the price and stock from the product, reduces stock, and
    stores the price paid on each order line, so a later price change cannot rewrite what a
    customer was charged. Admins manage orders under `/admin/orders`.

    ## Catalog

    `/products` is read-only and shows products that are on sale. Managing the catalog is an
    admin function under `/admin/products`, where `DELETE` archives a product
    (`isActive: false`) instead of deleting the row, so past orders keep pointing at it.

    Money (`price`, `unitPrice`, `total`) is `NUMERIC` in Postgres and is returned as a
    **string** such as `"19.99"`, so no decimal is lost on the way.

    ## Activity trail

    Two separate trails:

    - **Audit log** (`GET /admin/audit-logs`) — security-relevant events: every write a
      signed-in user makes, admin reads of account data, logins, failed logins, logouts,
      registrations and replayed refresh tokens. Each row keeps a few non-secret details —
      never a password, a token or a whole request body. Routine catalog reads are not
      recorded. No route edits or deletes an entry; the server deletes entries older than
      `AUDIT_LOG_RETENTION_DAYS` (default 90).
    - **Page views** (`GET /admin/page-views`) — analytics: the pages of the frontend a
      signed-in user opens, reported with `POST /page-views` and kept for
      `PAGE_VIEW_RETENTION_DAYS` (default 90).

    ## Rate limits

    - `POST /auth/register`, `POST /auth/login`, `POST /auth/refresh`: `AUTH_RATE_LIMIT`
      (default 20) requests per IP per 15 minutes.
    - Every other route: `API_RATE_LIMIT` (default 500) requests per IP per 15 minutes.
      This ceiling applies to every route below and is not repeated on each one.

    Both answer `429` with the envelope and `code: "rate_limited"`, send `RateLimit-Limit`,
    `RateLimit-Remaining` and `RateLimit-Reset` headers, and are disabled when the server
    runs with `ENV=test`.

    ## Errors

    `5xx` responses are deliberately opaque — the server logs the real error and returns
    `"Internal Server Error"` so stack traces, SQL and internal paths never reach a client.
    Every response carries an `X-Request-Id` header that matches the server log entry.

    A value the database rejects is the client's mistake, not a server failure: a taken
    username is `409 Username already exists`, an id that points at nothing is `400`, and a
    value too long or too large for its column is `400`. An unknown path answers `404` with
    the envelope.

    Every route that sets a password requires at least 8 characters and stores it exactly
    as sent — surrounding spaces are not trimmed.
  contact:
    name: Storefront API
  license:
    name: ISC
    url: https://opensource.org/license/isc-license-txt

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Health
    description: Liveness check.
  - name: Auth
    description: Registration, login, token refresh and session management.
  - name: Users
    description: The token's own account. Managing other accounts belongs to `/admin/users`.
  - name: Products
    description: Catalog, read-only and limited to products on sale.
  - name: Orders
    description: Orders belonging to the token user. Checkout creates them; they are read-only here.
  - name: Cart
    description: The token user's cart, and checkout.
  - name: Addresses
    description: The token user's shipping addresses.
  - name: Page Views
    description: The frontend reports each page a signed-in user opens.
  - name: Admin · Users
    description: Manage any account, including roles and password resets.
  - name: Admin · Products
    description: Manage the catalog, including archived products.
  - name: Admin · Orders
    description: Manage any user's orders and their line items.
  - name: Admin · Carts
    description: Inspect and manage any user's cart.
  - name: Admin · Addresses
    description: Manage any user's shipping addresses.
  - name: Admin · Activity
    description: Read-only history — the audit log and page views.

security:
  - bearerAuth: []

paths:

  # ── Health ──────────────────────────────────────────────────────────────────

  /:
    get:
      tags: [Health]
      summary: Health check
      description: Answers while the server is up. The only route outside the envelope.
      operationId: health
      security: []
      responses:
        '200':
          description: The server is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Storefront API is running! }

  # ── Auth ────────────────────────────────────────────────────────────────────

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register an account
      description: |
        Creates a `customer` account and signs it in. A `role` sent in the body is ignored —
        self-registration can never create an admin.

        `firstName` falls back to the username and `lastName` to an empty string when omitted.
        Usernames are compared case-insensitively, so `Alice` and `alice` are the same account.

        Returns the access token in the body and sets the refresh cookie.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 1, maxLength: 100, example: johndoe }
                password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 128
                  example: pass1234
                firstName: { type: string, example: John }
                lastName: { type: string, example: Doe }
      responses:
        '201':
          description: Account created.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      status: { type: integer, example: 201 }
                      message: { type: string, example: Account created successfully. }
                      data: { $ref: '#/components/schemas/AuthSession' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/UsernameTaken'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: |
        Exchanges credentials for an access token, and sets the refresh cookie.

        A wrong username and a wrong password answer the same way, and take the same time,
        so neither reveals which accounts exist. The attempt is recorded in the audit log
        with the username that was tried — never the password.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: johndoe }
                password: { type: string, format: password, example: pass1234 }
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Login successful! Welcome back. }
                      data: { $ref: '#/components/schemas/AuthSession' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong username or password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                status: 401
                message: Invalid username or password
                data: null
                code: invalid_credentials
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Renew the session
      description: |
        Reads the refresh cookie, issues a new access token and rotates the cookie. Send it
        with credentials; there is no request body.

        Rotation is single-use: the token in the cookie is invalidated as it is exchanged.
        Presenting an already-exchanged token means it was copied, so the whole session is
        revoked and `auth.refresh_token_reuse` is recorded in the audit log.
      operationId: refreshSession
      security: []
      responses:
        '200':
          description: A new access token, and a fresh refresh cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Token refreshed successfully. }
                      data: { $ref: '#/components/schemas/AuthSession' }
        '401':
          description: The cookie is missing, expired or already used.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                status: 401
                message: Invalid or expired refresh token
                data: null
                code: token_invalid
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out of this session
      description: |
        Revokes the session the refresh cookie belongs to and clears the cookie. Answers
        `200` even without a cookie, so a client can always finish signing out.
      operationId: logout
      security: []
      responses:
        '200':
          description: Signed out.
          headers:
            Set-Cookie:
              description: Clears the refresh cookie.
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Logged out successfully. }
                      data: { type: object, nullable: true, example: null }
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout-all:
    post:
      tags: [Auth]
      summary: Log out everywhere
      description: Deletes every refresh token of the signed-in account and clears the cookie.
      operationId: logoutAll
      responses:
        '200':
          description: Every session was revoked.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: All sessions revoked. }
                      data: { type: object, nullable: true, example: null }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: The signed-in account
      operationId: me
      responses:
        '200':
          description: The account the token belongs to.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: User fetched successfully. }
                      data: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Users ───────────────────────────────────────────────────────────────────

  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Your account
      description: |
        The account the token belongs to, with its five most recent purchases. Any other id
        answers `403`, for an admin token too — `/admin/users/{id}` is the way to read
        another account.
      operationId: getOwnUser
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: User fetched. }
                      data: { $ref: '#/components/schemas/UserWithPurchases' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotYourAccount'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Users]
      summary: Update your profile
      description: |
        Changes `firstName`, `lastName` or `username` — at least one of them. The role and
        the password are not accepted here: the password has its own route below, so a
        profile update can never change credentials or privileges.
      operationId: updateOwnUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: User updated. }
                      data: { $ref: '#/components/schemas/User' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotYourAccount'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/UsernameTaken'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Users]
      summary: Close your account
      description: |
        Scrubs the profile, deletes the addresses and cart, and ends every session. The row
        itself stays so the orders placed with it keep an owner, and the username is freed
        for someone else. The account can no longer sign in, and reads answer `404`.
      operationId: closeOwnAccount
      responses:
        '200':
          description: The account as it was before it was closed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Account closed. }
                      data: { $ref: '#/components/schemas/User' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotYourAccount'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Users]
      summary: Change your password
      description: |
        Takes the current password as well as the new one, so a stolen access token alone
        cannot lock the owner out. Every other session of the account ends, and the reply
        carries a fresh access token and refresh cookie so this client stays signed in.
      operationId: changeOwnPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password, example: pass1234 }
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 128
                  example: newpass1234
      responses:
        '200':
          description: The password was changed and this session renewed.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: Password changed. Other sessions were signed out.
                      data: { $ref: '#/components/schemas/AuthSession' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: No token, or the current password is wrong.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                status: 401
                message: Current password is incorrect
                data: null
                code: invalid_credentials
        '403':
          $ref: '#/components/responses/NotYourAccount'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Products ────────────────────────────────────────────────────────────────

  /api/v1/products:
    get:
      tags: [Products]
      summary: Browse the catalog
      description: |
        Products that are on sale, newest ids last. Filtering happens on the server, so a
        page only ever holds matching products. Archived products are not listed here.
      operationId: listProducts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: category
          in: query
          description: Exact category, compared case-insensitively.
          schema: { type: string, maxLength: 100 }
          example: Electronics
        - name: search
          in: query
          description: Text to look for in the name or description, case-insensitive.
          schema: { type: string, maxLength: 100 }
          example: watch
      responses:
        '200':
          description: One page of the catalog.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      message: { type: string, example: Products fetched. }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Product' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/products/popular:
    get:
      tags: [Products]
      summary: Most bought products
      description: |
        The five products with the highest quantity across **completed** orders, so an order
        that was never checked out cannot promote a product. Archived products are left out.
      operationId: listPopularProducts
      responses:
        '200':
          description: The most bought products.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Most popular products fetched. }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Product' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/products/categories:
    get:
      tags: [Products]
      summary: Every category on sale
      description: The distinct categories of products that are on sale, sorted A–Z.
      operationId: listCategories
      responses:
        '200':
          description: The categories.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Categories fetched. }
                      data:
                        type: array
                        items: { type: string }
                        example: [Clothing, Electronics, Furniture]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      summary: One product
      description: A product that is on sale. An archived product answers `404` here.
      operationId: getProduct
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Product fetched. }
                      data: { $ref: '#/components/schemas/Product' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Orders ──────────────────────────────────────────────────────────────────

  /api/v1/orders:
    get:
      tags: [Orders]
      summary: Your orders
      description: |
        Orders belonging to the token user, newest first, each with the total it was charged.
        There is no route here that creates or changes an order: checkout creates them, and
        `/admin/orders` is where they are managed.
      operationId: listOwnOrders
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          description: One page of your orders.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      message: { type: string, example: Orders fetched. }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Order' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      summary: One of your orders
      description: Someone else's order answers `404`, so its existence is never revealed.
      operationId: getOwnOrder
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Order fetched. }
                      data: { $ref: '#/components/schemas/Order' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFoundOrNotYours'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders/{id}/products:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      summary: What an order holds
      description: |
        The lines of one of your orders. Each line keeps the price charged at the time
        (`unitPrice`) and the option that was chosen (`typeId`), so a later price change
        does not alter the order.
      operationId: getOwnOrderLines
      responses:
        '200':
          description: The order lines.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Order products fetched. }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/OrderLine' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFoundOrNotYours'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Cart ────────────────────────────────────────────────────────────────────

  /api/v1/cart:
    get:
      tags: [Cart]
      summary: Your cart
      description: Every row in the token user's cart, each with the product it points at.
      operationId: getCart
      responses:
        '200':
          description: The cart.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Cart fetched. }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CartItem' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Cart]
      summary: Put something in the cart
      description: |
        Adds a product, or an option of it named by `typeId`. The same product and option
        twice adds up the quantities (capped at 999).

        The option, its price and the shop are read from the product; a price or option sent
        in the body is ignored. A product that does not exist or is archived answers `400`,
        and so does leaving `typeId` out for a product that has options.
      operationId: addCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemInput' }
      responses:
        '201':
          description: The cart row.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      status: { type: integer, example: 201 }
                      message: { type: string, example: Item added to cart. }
                      data: { $ref: '#/components/schemas/CartItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Cart]
      summary: Empty the cart
      operationId: clearCart
      responses:
        '200':
          description: The cart is empty.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Cart cleared. }
                      data: { type: object, nullable: true, example: null }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/cart/checkout:
    post:
      tags: [Cart]
      summary: Buy the chosen cart rows
      description: |
        Turns the cart rows named by `cartItemIds` into one completed order, in a single
        transaction that locks those rows and the products they point at:

        - the quantity comes from the cart row, never from the request;
        - the price comes from the product, or from the chosen option, and is stored on the
          order line;
        - stock is checked and reduced on whichever row holds it: the option when one was
          chosen, otherwise the product;
        - the rows that were paid for leave the cart, and the rest stay.

        `addressId` must be one of the caller's own addresses; any other id answers `404`.
        It is copied onto the order, so editing or deleting that address later does not
        change where the order says it was sent.

        Anything that no longer adds up stops the whole checkout with `409` and changes
        nothing: an archived product, an option that is gone, or too little stock.
      operationId: checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cartItemIds, addressId]
              properties:
                cartItemIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: integer, minimum: 1 }
                  example: [12, 13]
                addressId:
                  type: integer
                  minimum: 1
                  description: One of the caller's own addresses, to ship the order to.
                  example: 3
      responses:
        '201':
          description: The order and its lines.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      status: { type: integer, example: 201 }
                      message: { type: string, example: Checkout successful. }
                      data:
                        type: object
                        properties:
                          order: { $ref: '#/components/schemas/Order' }
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/OrderLine' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The cart no longer adds up, and nothing was charged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                outOfStock:
                  summary: Not enough stock
                  value:
                    status: 409
                    message: Only 2 left of "Smart Fitness Tracker Watch"
                    data: null
                    code: conflict
                archived:
                  summary: A product was archived
                  value:
                    status: 409
                    message: One of those products is no longer on sale
                    data: null
                    code: conflict
                goneFromCart:
                  summary: A row is no longer in the cart
                  value:
                    status: 409
                    message: Some of those items are no longer in your cart
                    data: null
                    code: conflict
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/cart/{id}:
    parameters:
      - $ref: '#/components/parameters/CartItemId'
    patch:
      tags: [Cart]
      summary: Change a quantity
      description: A row that is not yours answers `404`.
      operationId: updateCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, maximum: 999, example: 3 }
      responses:
        '200':
          description: The updated row.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Cart item updated. }
                      data: { $ref: '#/components/schemas/CartItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFoundOrNotYours'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Cart]
      summary: Take a row out of the cart
      operationId: removeCartItem
      responses:
        '200':
          description: The row that was removed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Cart item removed. }
                      data: { $ref: '#/components/schemas/CartItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFoundOrNotYours'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Addresses ───────────────────────────────────────────────────────────────

  /api/v1/addresses:
    get:
      tags: [Addresses]
      summary: Your addresses
      description: The default address first, then the rest oldest first.
      operationId: listAddresses
      responses:
        '200':
          description: The addresses.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Addresses fetched. }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Address' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Addresses]
      summary: Save an address
      description: |
        The first address saved becomes the default one. Saving another with
        `isDefault: true` moves the default over to it.
      operationId: createAddress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: The saved address.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      status: { type: integer, example: 201 }
                      message: { type: string, example: Address created. }
                      data: { $ref: '#/components/schemas/Address' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/addresses/{id}:
    parameters:
      - $ref: '#/components/parameters/AddressId'
    get:
      tags: [Addresses]
      summary: One of your addresses
      operationId: getAddress
      responses:
        '200':
          description: The address.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Address fetched. }
                      data: { $ref: '#/components/schemas/Address' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFoundOrNotYours'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Addresses]
      summary: Change an address
      description: |
        At least one field. An address that is not yours answers `404` and changes nothing —
        including your own default, which the update checks ownership before touching.
      operationId: updateAddress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressUpdate' }
      responses:
        '200':
          description: The updated address.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Address updated. }
                      data: { $ref: '#/components/schemas/Address' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFoundOrNotYours'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Addresses]
      summary: Delete an address
      description: Deleting the default one hands the default to the oldest address that is left.
      operationId: deleteAddress
      responses:
        '200':
          description: The address that was deleted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Address deleted. }
                      data: { $ref: '#/components/schemas/Address' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFoundOrNotYours'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Page views ──────────────────────────────────────────────────────────────

  /api/v1/page-views:
    post:
      tags: [Page Views]
      summary: Report a page the user opened
      description: |
        The frontend calls this on each navigation. The row lands in `page_views`, which
        admins read with `GET /admin/page-views`; it leaves no entry in the audit log.
      operationId: recordPageView
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  maxLength: 255
                  pattern: '^/[^\s?#]*$'
                  description: A page path, without query string or fragment.
                  example: /products/5
                page:
                  type: string
                  maxLength: 60
                  description: The name the frontend gives that page.
                  example: Product detail
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      status: { type: integer, example: 201 }
                      message: { type: string, example: Page view recorded. }
                      data: { type: object, nullable: true, example: null }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Admin · Users ───────────────────────────────────────────────────────────

  /api/v1/admin/users:
    get:
      tags: [Admin · Users]
      summary: List accounts
      description: Every open account. Closed accounts are not listed.
      operationId: adminListUsers
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: One page of accounts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      message: { type: string, example: Users fetched. }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Admin · Users]
      summary: Create an account
      description: Unlike self-registration, this may set the role.
      operationId: adminCreateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, username, password]
              properties:
                firstName: { type: string, maxLength: 100, example: Jane }
                lastName: { type: string, maxLength: 100, example: Doe }
                username: { type: string, maxLength: 100, example: janedoe }
                password: { type: string, format: password, minLength: 8, example: pass1234 }
                role:
                  allOf: [{ $ref: '#/components/schemas/UserRole' }]
                  default: customer
      responses:
        '201':
          description: The account.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      status: { type: integer, example: 201 }
                      message: { type: string, example: User created. }
                      data: { $ref: '#/components/schemas/User' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '409':
          $ref: '#/components/responses/UsernameTaken'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin · Users]
      summary: One account
      description: The account with its five most recent purchases. Recorded in the audit log.
      operationId: adminGetUser
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: User fetched. }
                      data: { $ref: '#/components/schemas/UserWithPurchases' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Admin · Users]
      summary: Update a profile
      description: Profile fields only. The role and the password have their own routes.
      operationId: adminUpdateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: User updated. }
                      data: { $ref: '#/components/schemas/User' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/UsernameTaken'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Admin · Users]
      summary: Close an account
      description: |
        Scrubs the profile, deletes the addresses and cart and ends every session, keeping
        the row so its orders keep an owner. An admin cannot close their own account here.
      operationId: adminCloseAccount
      responses:
        '200':
          description: The account as it was before it was closed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Account closed. }
                      data: { $ref: '#/components/schemas/User' }
        '400':
          description: Invalid id, or the admin's own account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                status: 400
                message: You cannot close your own account through the admin API
                data: null
                code: bad_request
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}/role:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Admin · Users]
      summary: Change a role
      description: |
        Ends every session of that account, so the old privilege cannot be renewed. An admin
        cannot change their own role, which keeps the last admin from locking themselves out.
      operationId: adminUpdateUserRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/UserRole' }
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: User role updated. }
                      data: { $ref: '#/components/schemas/User' }
        '400':
          description: Invalid role, or the admin's own account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                status: 400
                message: You cannot change your own role
                data: null
                code: bad_request
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Admin · Users]
      summary: Reset a password
      description: |
        Sets a new password without the old one, and ends every session of that account.
        The admin's own session is untouched.
      operationId: adminResetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 128
                  example: freshpass1234
      responses:
        '200':
          description: The password was reset.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: Password reset. That user was signed out everywhere.
                      data: { type: object, nullable: true, example: null }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Admin · Products ────────────────────────────────────────────────────────

  /api/v1/admin/products:
    get:
      tags: [Admin · Products]
      summary: List every product
      description: Archived products included, which `/products` leaves out.
      operationId: adminListProducts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: category
          in: query
          schema: { type: string, maxLength: 100 }
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: One page of products.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      message: { type: string, example: Products fetched. }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Product' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Admin · Products]
      summary: Add a product
      description: |
        Every field is checked, including the entries of `types` and `reviews`, so a
        malformed value cannot reach the database and break later reads of the catalog.
      operationId: adminCreateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: The product.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      status: { type: integer, example: 201 }
                      message: { type: string, example: Product created. }
                      data: { $ref: '#/components/schemas/Product' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/products/bulk:
    post:
      tags: [Admin · Products]
      summary: Add many products
      description: |
        Takes an array of 1–500 products and saves them in one transaction: if one of them
        is wrong, none of them are saved.
      operationId: adminCreateProducts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 500
              items: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: The products that were saved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      status: { type: integer, example: 201 }
                      message: { type: string, example: 2 products created. }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Product' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Admin · Products]
      summary: One product, archived or not
      operationId: adminGetProduct
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Product fetched. }
                      data: { $ref: '#/components/schemas/Product' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Admin · Products]
      summary: Change a product
      description: |
        Changes only the fields it is given — at least one of them. Setting
        `isActive: true` puts an archived product back on sale.
      operationId: adminUpdateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdate' }
      responses:
        '200':
          description: The updated product.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Product updated. }
                      data: { $ref: '#/components/schemas/Product' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Admin · Products]
      summary: Archive a product
      description: |
        Takes the product off sale (`isActive: false`) instead of deleting the row, so the
        order lines that point at it keep working. `PATCH` with `isActive: true` undoes it.
      operationId: adminArchiveProduct
      responses:
        '200':
          description: The archived product.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Product archived. }
                      data: { $ref: '#/components/schemas/Product' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

