          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The `accessToken` from `POST /auth/register`, `POST /auth/login` or
        `POST /auth/refresh`, sent as `Authorization: Bearer <accessToken>`.
        Expires after 15 minutes by default. The refresh token is not sent this way: it
        travels in an HttpOnly cookie.

  headers:
    RefreshCookie:
      description: |
        The refresh token, in a cookie JavaScript cannot read:
        `HttpOnly`, `SameSite=Strict`, `Path=/api/v1/auth`, and `Secure` in production.
      schema: { type: string }
      example: refreshToken=6f1a…; Max-Age=604800; Path=/api/v1/auth; HttpOnly; SameSite=Strict

  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: User id.
      schema: { type: integer, minimum: 1 }
      example: 1
    UserIdPath:
      name: userId
      in: path
      required: true
      description: User id.
      schema: { type: integer, minimum: 1 }
      example: 1
    ProductId:
      name: id
      in: path
      required: true
      description: Product id.
      schema: { type: integer, minimum: 1 }
      example: 1
    OrderId:
      name: id
      in: path
      required: true
      description: Order id.
      schema: { type: integer, minimum: 1 }
      example: 1
    CartItemId:
      name: id
      in: path
      required: true
      description: Cart item id.
      schema: { type: integer, minimum: 1 }
      example: 1
    AddressId:
      name: id
      in: path
      required: true
      description: Address id.
      schema: { type: integer, minimum: 1 }
      example: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Bounded so one request cannot pull a whole table.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      description: Rows to skip.
      schema:
        type: integer
        minimum: 0
        default: 0

  schemas:

    Envelope:
      type: object
      required: [status, message, data]
      properties:
        status:
          type: integer
          description: Repeats the HTTP status code.
          example: 200
        message:
          type: string
          description: A sentence a client may show as-is.
          example: Products fetched.
        data:
          description: The payload, or `null` on an error.
          nullable: true

    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [code]
          properties:
            data: { type: object, nullable: true, example: null }
            code:
              type: string
              description: What went wrong, in a form a client can branch on.
              enum:
                - invalid_request
                - bad_request
                - no_token
                - token_expired
                - token_invalid
                - invalid_credentials
                - forbidden
                - not_found
                - conflict
                - rate_limited
                - internal_error

    PagedEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [meta]
          properties:
            meta: { $ref: '#/components/schemas/PageMeta' }

    PageMeta:
      type: object
      required: [limit, offset, total]
      properties:
        limit: { type: integer, example: 50 }
        offset: { type: integer, example: 0 }
        total:
          type: integer
          description: Rows the filter matches, not just the ones on this page.
          example: 134

    UserRole:
      type: string
      enum: [customer, admin]
      example: customer

    OrderStatus:
      type: string
      enum: [active, complete]
      example: complete

    AddressLabel:
      type: string
      enum: [home, work, other]
      example: home

    Money:
      type: string
      description: 'An amount with two decimals. `NUMERIC` in Postgres, so it travels as a string.'
      example: '129.99'

    User:
      type: object
      description: No password field exists on this shape, so a hash cannot leak by accident.
      properties:
        id: { type: integer, example: 1 }
        firstName: { type: string, example: John }
        lastName: { type: string, example: Doe }
        username: { type: string, example: johndoe }
        role: { $ref: '#/components/schemas/UserRole' }

    UserWithPurchases:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            recentPurchases:
              type: array
              description: The five most recent lines from completed orders.
              items: { $ref: '#/components/schemas/RecentPurchase' }

    ProfileUpdate:
      type: object
      minProperties: 1
      description: At least one field. The role and the password are not accepted here.
      properties:
        firstName: { type: string, maxLength: 100, example: John }
        lastName: { type: string, maxLength: 100, example: Doe }
        username: { type: string, maxLength: 100, example: johndoe }

    RecentPurchase:
      type: object
      properties:
        productId: { type: integer, example: 1 }
        name: { type: string, example: Smart Fitness Tracker Watch }
        price:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: What was paid for it, not what it costs today.
        category: { type: string, nullable: true, example: Electronics }
        image: { type: string, nullable: true }
        description: { type: string, nullable: true }
        quantity: { type: integer, example: 2 }
        orderId: { type: integer, example: 7 }
        purchasedAt: { type: string, format: date-time, example: '2026-09-22T10:42:05.000Z' }

    AuthSession:
      type: object
      description: |
        What a session start or renewal returns. The refresh token is not in here — it is set
        as an HttpOnly cookie.
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken:
          type: string
          description: HS256 JWT, valid for 15 minutes by default.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    ProductType:
      type: object
      description: One option of a product, with its own price and stock.
      properties:
        _id: { type: string, example: 69999b5d6decb17b3853fc1d }
        productId: { type: integer, example: 5002 }
        color: { type: string, example: Rose Gold }
        price: { type: number, format: float, example: 139.99 }
        stock: { type: integer, example: 40 }
        image: { type: string }

    Review:
      type: object
      properties:
        _id: { type: string }
        star: { type: number, minimum: 0, maximum: 5, example: 5 }
        comment: { type: string, example: Excellent fitness tracker! }
        userId: { type: string, example: user135 }
        userName: { type: string, example: Jennifer Martinez }
        date: { type: string, example: '2026-01-08T08:30:00.000Z' }

    Product:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Smart Fitness Tracker Watch }
        price: { $ref: '#/components/schemas/Money' }
        category: { type: string, nullable: true, example: Electronics }
        image: { type: string, nullable: true }
        description: { type: string, nullable: true }
        previewImg:
          type: array
          items: { type: string }
        types:
          type: array
          items: { $ref: '#/components/schemas/ProductType' }
        reviews:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        overallRating: { type: number, minimum: 0, maximum: 5, example: 4.7 }
        stock:
          type: integer
          minimum: 0
          description: >-
            For a product with options this is their stock added up; otherwise it is the
            product's own stock.
          example: 145
        isActive:
          type: boolean
          description: '`false` means archived: it is off sale and hidden from `/products`.'
          example: true
        shopId: { type: string, nullable: true, example: shop_001 }
        shopName: { type: string, nullable: true, example: TechZone Store }

    ProductInput:
      type: object
      required: [name, price]
      properties:
        name: { type: string, maxLength: 255, example: Smart Fitness Tracker Watch }
        price:
          description: A number or a numeric string, 0 or more, at most two decimals.
          oneOf:
            - { type: number, format: float }
            - { type: string }
          example: 129.99
        category: { type: string, nullable: true, maxLength: 100, example: Electronics }
        image: { type: string, nullable: true, maxLength: 500 }
        description: { type: string, nullable: true, maxLength: 5000 }
        previewImg:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 500 }
          default: []
        types:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ProductType' }
          default: []
        reviews:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/Review' }
          default: []
        overallRating: { type: number, minimum: 0, maximum: 5, default: 0 }
        stock: { type: integer, minimum: 0, default: 0 }
        isActive: { type: boolean, default: true }
        shopId: { type: string, nullable: true, maxLength: 255 }
        shopName: { type: string, nullable: true, maxLength: 255 }

    ProductUpdate:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          minProperties: 1
          description: Every field is optional here, but at least one must be sent.

    Order:
      type: object
      properties:
        id: { type: integer, example: 7 }
        userId: { type: integer, example: 1 }
        status: { $ref: '#/components/schemas/OrderStatus' }
        createdAt: { type: string, format: date-time, example: '2026-09-22T10:42:05.000Z' }
        total:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: The sum of its lines, at the prices charged.
          example: '279.98'
        addressId:
          type: integer
          nullable: true
          description: The address it was shipped to, or null once that address is deleted.
          example: 3
        shippingAddress:
          allOf: [{ $ref: '#/components/schemas/ShippingAddress' }]
          nullable: true
          description: Copied onto the order when it was placed, so it never changes afterwards.

    ShippingAddress:
      type: object
      description: Where an order was sent, as it read at the moment of checkout.
      properties:
        fullName: { type: string, example: Jane Doe }
        phone: { type: string, nullable: true, example: '+44 20 7946 0958' }
        address: { type: string, example: 12 Market Street }
        city: { type: string, example: Manchester }
        label: { $ref: '#/components/schemas/AddressLabel' }

    OrderLine:
      type: object
      properties:
        id: { type: integer, example: 11 }
        orderId: { type: integer, example: 7 }
        productId: { type: integer, example: 1 }
        variantId:
          type: integer
          nullable: true
          description: The option row that was bought, or null once that option is retired.
          example: 42
        typeId:
          type: string
          nullable: true
          description: The name of the option that was bought, kept even if it is retired later.
          example: 69999b5d6decb17b3853fc1d
        quantity: { type: integer, example: 2 }
        unitPrice:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: What one of them cost when the order was placed.
          example: '139.99'

    CartItem:
      type: object
      description: A cart row, with the product it points at.
      properties:
        id: { type: integer, example: 12 }
        userId: { type: integer, example: 1 }
        productId: { type: integer, example: 1 }
        quantity: { type: integer, example: 2 }
        typeId: { type: string, nullable: true, example: 69999b5d6decb17b3853fc1d }
        selectedType:
          allOf: [{ $ref: '#/components/schemas/ProductType' }]
          nullable: true
          description: The chosen option, as the product defines it.
        shopId: { type: string, nullable: true, example: shop_001 }
        shopName: { type: string, nullable: true, example: TechZone Store }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        productName: { type: string, example: Smart Fitness Tracker Watch }
        productPrice: { $ref: '#/components/schemas/Money' }
        productCategory: { type: string, nullable: true, example: Electronics }
        productImage: { type: string, nullable: true }
        productDescription: { type: string, nullable: true }
        productPreviewImg:
          type: array
          items: { type: string }
        productTypes:
          type: array
          items: { $ref: '#/components/schemas/ProductType' }
        productReviews:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        productOverallRating: { type: number, example: 4.7 }
        productStock: { type: integer, example: 145 }
        productIsActive: { type: boolean, example: true }
        productShopId: { type: string, nullable: true }
        productShopName: { type: string, nullable: true }

    CartItemInput:
      type: object
      required: [productId]
      description: |
        The option is named by id only. Its price, its stock and the shop are read from the
        product, so a price sent here is ignored.
      properties:
        productId: { type: integer, minimum: 1, example: 1 }
        quantity: { type: integer, minimum: 1, maximum: 999, default: 1, example: 2 }
        typeId:
          type: string
          nullable: true
          maxLength: 255
          example: 69999b5d6decb17b3853fc1d

    Address:
      type: object
      properties:
        id: { type: integer, example: 3 }
        userId: { type: integer, example: 1 }
        fullName: { type: string, example: Ada Lovelace }
        phone: { type: string, nullable: true, example: '0700000000' }
        address: { type: string, example: 12 Analytical Way }
        city: { type: string, example: London }
        label: { $ref: '#/components/schemas/AddressLabel' }
        isDefault: { type: boolean, example: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AddressInput:
      type: object
      required: [fullName, address, city]
      properties:
        fullName: { type: string, maxLength: 255, example: Ada Lovelace }
        phone: { type: string, nullable: true, maxLength: 50, example: '0700000000' }
        address: { type: string, maxLength: 2000, example: 12 Analytical Way }
        city: { type: string, maxLength: 255, example: London }
        label:
          allOf: [{ $ref: '#/components/schemas/AddressLabel' }]
          default: home
        isDefault: { type: boolean, default: false }

    AddressUpdate:
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          minProperties: 1
          description: Every field is optional here, but at least one must be sent.

    AuditAction:
      type: string
      enum: [CREATE, READ, UPDATE, DELETE, LOGIN, LOGIN_FAILED, LOGOUT, REGISTER, SECURITY]
      example: CREATE

    AuditLog:
      type: object
      properties:
        id: { type: integer, example: 42 }
        createdAt: { type: string, format: date-time, example: '2026-09-22T10:42:05.000Z' }
        userId:
          type: integer
          nullable: true
          description: 'Not a foreign key: the log outlives the account.'
          example: 7
        username: { type: string, nullable: true, example: alice }
        userRole:
          allOf: [{ $ref: '#/components/schemas/UserRole' }]
          nullable: true
        action: { $ref: '#/components/schemas/AuditAction' }
        event:
          type: string
          description: What happened, as a code a UI can make readable.
          example: cart.item_added
        method: { type: string, nullable: true, example: POST }
        path: { type: string, nullable: true, example: /api/v1/cart }
        statusCode: { type: integer, nullable: true, example: 201 }
        ipAddress: { type: string, nullable: true, example: 203.0.113.5 }
        userAgent: { type: string, nullable: true }
        details:
          type: object
          nullable: true
          description: |
            A few non-secret facts about the event — ids, quantities, or the names of the
            fields an update carried. Never a password, a token or a whole request body.
          additionalProperties: true
          example: { productId: 5, quantity: 2 }

    PageView:
      type: object
      properties:
        id: { type: integer, example: 91 }
        createdAt: { type: string, format: date-time, example: '2026-09-22T10:42:05.000Z' }
        userId: { type: integer, nullable: true, example: 7 }
        username: { type: string, nullable: true, example: alice }
        path: { type: string, example: /products/5 }
        page: { type: string, nullable: true, example: Product detail }
        ipAddress: { type: string, nullable: true, example: 203.0.113.5 }
        userAgent: { type: string, nullable: true }

  responses:

    BadRequest:
      description: The request does not add up. `message` names the field that was wrong.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            status: 400
            message: quantity must be a whole number between 1 and 999
            data: null
            code: invalid_request

    Unauthorized:
      description: |
        No token, an expired one, or one that does not check out. `code` tells a client
        whether to renew the session (`token_expired`) or sign in again.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            noToken:
              value: { status: 401, message: Access denied. No token provided., data: null, code: no_token }
            expired:
              value: { status: 401, message: Access token has expired., data: null, code: token_expired }
            invalid:
              value: { status: 401, message: Invalid token., data: null, code: token_invalid }

    NotYourAccount:
      description: The id belongs to another account.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            status: 403
            message: You can only access your own data
            data: null
            code: forbidden

    AdminRequired:
      description: The token is valid, but the account is not an admin.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            status: 403
            message: Admin access required
            data: null
            code: forbidden

    NotFound:
      description: Nothing with that id.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            status: 404
            message: product with id 999 not found
            data: null
            code: not_found

    NotFoundOrNotYours:
      description: |
        Nothing with that id, or it belongs to someone else — the two answer the same way, so
        the existence of another user's row is never revealed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            status: 404
            message: order with id 999 not found
            data: null
            code: not_found

    UsernameTaken:
      description: That username already exists (compared case-insensitively).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            status: 409
            message: Username already exists
            data: null
            code: conflict

    PayloadTooLarge:
      description: The body is over `JSON_BODY_LIMIT` (1 MB by default).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            status: 413
            message: Request body is too large
            data: null
            code: invalid_request

    RateLimited:
      description: |
        Too many requests from this IP. `RateLimit-Limit`, `RateLimit-Remaining` and
        `RateLimit-Reset` say how much is left and when it resets.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            status: 429
            message: Too many attempts. Please wait a moment and try again.
            data: null
            code: rate_limited

    InternalError:
      description: |
        Something went wrong on the server. The real error is logged with the request id from
        the `X-Request-Id` header; the answer stays deliberately vague.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            status: 500
            message: Internal Server Error
            data: null
            code: internal_error
