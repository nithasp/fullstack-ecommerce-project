          description: Part of a username, case-insensitive.
          schema: { type: string, maxLength: 100 }
        - name: path
          in: query
          description: Part of a page path, case-insensitive.
          schema: { type: string, maxLength: 100 }
          example: /products
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
