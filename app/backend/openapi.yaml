        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Admin · Orders]
      summary: Open an order for a user
      description: Creates an empty order. Lines are added with the route below.
      operationId: adminCreateOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
