      tags: [Admin · Activity]
      summary: Read the page views
      description: The pages of the frontend people opened, newest first.
      operationId: adminListPageViews
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: userId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: username
