  # ── Admin · Activity ────────────────────────────────────────────────────────

  /api/v1/admin/audit-logs:
    get:
      tags: [Admin · Activity]
      summary: Read the audit log
      description: |
        Security-relevant events, newest first. Reading the log is itself recorded.
        There is deliberately no route that edits or deletes an entry.
      operationId: adminListAuditLogs
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: userId
          in: query
          description: Only this account.
          schema: { type: integer, minimum: 1 }
        - name: username
          in: query
          description: Part of a username, case-insensitive.
          schema: { type: string, maxLength: 100 }
        - name: action
          in: query
          description: One type, or several separated by commas.
          schema: { type: string }
          example: LOGIN,LOGIN_FAILED
        - name: result
          in: query
          description: '`success` is a status below 400, `failure` is 400 and above.'
          schema: { type: string, enum: [success, failure] }
        - name: from
          in: query
          description: Oldest moment to include (ISO 8601).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Newest moment to include, exclusive (ISO 8601).
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: One page of the log.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      message: { type: string, example: Audit logs fetched. }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AuditLog' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalError'

