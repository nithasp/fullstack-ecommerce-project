      tags: [Admin · Orders]
      summary: What an order holds
      operationId: adminGetOrderLines
      responses:
        '200':
          description: The order lines.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Order products fetched. }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/OrderLine' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Admin · Orders]
      summary: Add a line to an order
      description: |
        The line keeps the price the product carries right now, the same way checkout does.
        Naming a `typeId` takes that option's price instead. Stock is not changed.
      operationId: adminAddOrderLine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId: { type: integer, minimum: 1, example: 1 }
                quantity: { type: integer, minimum: 1, maximum: 999, example: 2 }
                typeId:
                  type: string
                  nullable: true
                  maxLength: 255
                  example: 69999b5d6decb17b3853fc1d
      responses:
        '201':
          description: The line that was added.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      status: { type: integer, example: 201 }
