openapi: 3.0.3

info:
  title: Storefront API
  version: 1.0.0
  description: |
    REST API for the storefront backend — accounts, catalog, cart, checkout, orders,
    shipping addresses and an admin namespace.

    ## Base path

    Every API route is served under `/api/v1`, e.g. `POST /api/v1/auth/login`. The prose
    below leaves the prefix out. Only `GET /` (health check), `GET /docs` and
    `GET /openapi.yaml` sit at the server root.

    ## Response envelope

    Every route except `GET /` wraps its payload in the same envelope:

    ```json
    { "status": 200, "message": "Products fetched.", "data": [] }
    ```

    `status` repeats the HTTP status code and `data` is `null` on errors.

    ## Pagination

    Lists that can grow — products, users, orders and the admin lists — take `limit`
    (1–100, default 50) and `offset` (default 0), and add a `meta` object next to `data`:

    ```json
    { "status": 200, "message": "Products fetched.", "data": [], "meta": { "limit": 50, "offset": 0, "total": 134 } }
    ```

    ## Authentication

    All routes except `GET /`, `POST /auth/register`, `POST /auth/login`,
    `POST /auth/refresh` and `POST /auth/logout` require an access token:

    ```
    Authorization: Bearer <accessToken>
    ```

    Access tokens are HS256-signed JWTs (a token signed with any other algorithm is
    rejected) that expire after 15 minutes (`ACCESS_TOKEN_EXPIRY`) and carry `userId` and
    `role` claims. Refresh tokens last 7 days and are rotated on every `POST /auth/refresh` —
    the token you send is invalidated as soon as it is exchanged, and sending it again later
    revokes that whole session.

    **Token rejections do not use the envelope.** The auth middleware answers with a
    distinct code so a frontend can tell "refresh me" from "log in again":

    ```json
    { "error": "Access token has expired.", "code": "token_expired" }
    ```

    `code` is one of `no_token`, `token_expired` or `token_invalid`. A wrong username or
    password, by contrast, is raised by the handler and *does* use the envelope.

    ## Roles

    Every account has a `role` of `customer` (default) or `admin`.

    - Self-registration always creates a `customer`; a `role` in the register body is ignored.
      Admins are made with `npm run seed:admin` or `PUT /admin/users/{id}/role`.
    - Customers reach only their own user record, orders, cart and addresses. Another
      user's id returns `403` (users, addresses) or `404` (orders — the existence of
      someone else's order is never revealed).
    - Admins bypass those ownership checks, may write to the catalog, and get the `/admin`
      namespace. Admin routes re-read the role from the database on every request, so a
      demoted admin loses access immediately rather than when their token expires.

    ## Audit log

    Every request a signed-in user makes is recorded: who, when, the route, the result and a
    few non-secret details — never a password, a token or a request body. Logins, failed
    logins, logouts, registrations and replayed refresh tokens are recorded too, and so is
    every page of the frontend a signed-in user opens, which the frontend reports with
    `POST /page-views`. Admins read the log with `GET /admin/audit-logs`. No route edits or
    deletes an entry; the server deletes entries older than `AUDIT_LOG_RETENTION_DAYS`
    (default 90).

    ## Rate limits

    - `POST /auth/register`, `POST /auth/login`, `POST /auth/refresh`: 20 requests per IP
      per 15 minutes. Answers with the `error`/`code` shape (`code: "rate_limited"`).
    - Every other route: `API_RATE_LIMIT` (default 500) requests per IP per 15 minutes.
      Answers with the envelope: `{ "status": 429, "message": "Too many requests. Please
      wait a moment and try again.", "data": null }`. This ceiling applies to every route
      below and is not repeated on each one.

    Both limiters send `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset`
    headers, and both are disabled when the server runs with `ENV=test`.

    ## Errors

    `5xx` responses are deliberately opaque — the server logs the real error and returns
    `"Internal Server Error"` so stack traces, SQL and internal paths never reach a client.

    A value the database rejects is the client's mistake, not a server failure: a taken
    username is `409 Username already exists`, an id that points at nothing (an unknown
    `productId` in a cart, order or checkout) is `400 Product does not exist`, and a value
    too long or too large for its column is `400`. An unknown path answers `404` with the
    envelope.

    Every route that sets a password requires at least 8 characters and stores it exactly
    as sent — surrounding spaces are not trimmed.
  contact:
    name: Storefront API
  license:
    name: ISC
    url: https://opensource.org/license/isc-license-txt

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Health
    description: Liveness check.
  - name: Auth
    description: Registration, login, token refresh and session management.
  - name: Users
    description: |
      Your own account. Listing and creating accounts is an admin function; get, update and
      delete are limited to the token user unless the token belongs to an admin.
  - name: Products
    description: Catalog. Reads are open to any signed-in user; writes require an admin.
  - name: Orders
    description: Orders belonging to the token user (admins may reach any order).
  - name: Cart
    description: The token user's cart, and checkout.
  - name: Addresses
    description: The token user's shipping addresses.
  - name: Admin · Users
    description: Manage any account, including roles.
  - name: Admin · Orders
    description: Manage any user's orders and their line items.
  - name: Admin · Carts
    description: Inspect and manage any user's cart.
  - name: Admin · Addresses
    description: Manage any user's shipping addresses.
  - name: Admin · Audit Logs
    description: Read-only history of who did what, and when.
  - name: Page Views
    description: The frontend reports each page a signed-in user opens, for the audit log.

security:
  - bearerAuth: []

paths:

  # ── Health ──────────────────────────────────────────────────────────────────

  /:
    get:
      tags: [Health]
      summary: Health check
      description: Confirms the API is up. The only route that does not use the response envelope.
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: The API is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Storefront API is running!

  # ── Auth ────────────────────────────────────────────────────────────────────

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register an account
      description: |
        Creates a `customer` account and signs it in. A `role` sent in the body is ignored —
        self-registration can never create an admin.

        `firstName` falls back to the username and `lastName` to an empty string when omitted.

        Rate limited to 20 requests per IP per 15 minutes.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 1
                  example: johndoe
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: At least 8 characters.
                  example: pass1234
                firstName:
                  type: string
                  example: John
                lastName:
                  type: string
                  example: Doe
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      status: { type: integer, example: 201 }
                      message: { type: string, example: Account created successfully. }
                      data: { $ref: '#/components/schemas/AuthSession' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: The username is already taken.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              example: { status: 409, message: Username already exists, data: null }
        '429':
          $ref: '#/components/responses/AuthRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: |
        Exchanges credentials for an access token and a refresh token.

        Rate limited to 20 requests per IP per 15 minutes.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: johndoe }
                password: { type: string, format: password, example: pass1234 }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: 'Login successful! Welcome back.' }
                      data: { $ref: '#/components/schemas/AuthSession' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong username or password. Uses the envelope, not the token-error shape.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              example: { status: 401, message: Invalid username or password, data: null }
        '429':
          $ref: '#/components/responses/AuthRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh the access token
      description: |
        Rotates the pair: the refresh token you send is marked used and a new one is issued
        alongside a fresh access token. When two requests race with the same token, exactly
        one succeeds.

        Replaying a token that was already exchanged returns `401` **and revokes every token
        issued from the same login**, its successor included: a replay means the token was
        copied, so whoever holds the copy is cut off. The user's other sessions are unaffected.

        The account is re-read from the database, so the new access token carries the
        current role and a deleted account cannot refresh.

        Rate limited to 20 requests per IP per 15 minutes.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: A new token pair.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Token refreshed successfully. }
                      data:
                        type: object
                        properties:
                          accessToken: { type: string }
                          refreshToken: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The refresh token is unknown, already used or expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              example: { status: 401, message: Invalid or expired refresh token, data: null }
        '429':
          $ref: '#/components/responses/AuthRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out one session
      description: |
        Ends the session the supplied refresh token belongs to, including tokens already
        rotated out of it. Always answers `200`, whether or not the token
        existed, so a caller cannot probe which tokens are valid. No access token is required.
      operationId: logout
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              example: { status: 200, message: Logged out successfully., data: null }
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout-all:
    post:
      tags: [Auth]
      summary: Log out every session
      description: Revokes every refresh token belonging to the token user.
      operationId: logoutAll
      responses:
        '200':
          description: All sessions revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              example: { status: 200, message: All sessions revoked., data: null }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get the signed-in account
      operationId: getCurrentUser
      responses:
        '200':
          description: The token user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: User fetched successfully. }
                      data: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Users ───────────────────────────────────────────────────────────────────

  /api/v1/users:
    get:
      tags: [Users]
      summary: List users
      description: '**Admin only.** Paginated, lowest id first — the same list as `GET /admin/users`.'
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of accounts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Users fetched. }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Users]
      summary: Create a user
      description: |
        **Admin only.** Creates a `customer`; the role cannot be set here (`POST /admin/users`
        can). The password must be at least 8 characters, and a taken username returns `409`.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, username, password]
              properties:
                firstName: { type: string, example: John }
                lastName: { type: string, example: Doe }
                username: { type: string, example: johndoe }
                password: { type: string, format: password, minLength: 8, example: pass1234 }
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      status: { type: integer, example: 201 }
                      message: { type: string, example: User created. }
                      data: { $ref: '#/components/schemas/User' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '409':
          description: The username is taken.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              example: { status: 409, message: Username already exists, data: null }
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get a user
      description: |
        Your own account only — another user's id returns `403`. Admins may read any account.

        The payload adds `recentPurchases`: up to 5 line items from the user's most recent
        completed orders.
      operationId: getUser
      responses:
        '200':
          description: The account, with recent purchases.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: User fetched. }
                      data: { $ref: '#/components/schemas/UserWithPurchases' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Users]
      summary: Update a user
      description: |
        Your own account only — another user's id returns `403`. Admins may update any account.

        At least one field is required. The role is deliberately not writable here; it has its
        own route, `PUT /admin/users/{id}/role`. A new password must be at least 8 characters;
        a username that is already taken returns `409`.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Account updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: User updated. }
                      data: { $ref: '#/components/schemas/User' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The new username is taken.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              example: { status: 409, message: Username already exists, data: null }
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Users]
      summary: Delete a user
      description: |
        Your own account only — another user's id returns `403`. Admins may delete any account.
        Orders, cart items and addresses cascade.
      operationId: deleteUser
      responses:
        '200':
          description: Account deleted; the deleted record is returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: User deleted. }
                      data: { $ref: '#/components/schemas/User' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Products ────────────────────────────────────────────────────────────────

  /api/v1/products:
    get:
      tags: [Products]
      summary: List products
      description: |
        One page of the catalog, lowest id first, optionally narrowed by `category` and/or
        `search`. `meta.total` counts every match, so a client can keep paging with `offset`.
      operationId: listProducts
      parameters:
        - name: category
          in: query
          required: false
          description: Case-insensitive exact category match. At most 100 characters.
          schema: { type: string, maxLength: 100 }
          example: Electronics
        - name: search
          in: query
          required: false
          description: |
            Case-insensitive substring of the name or description. `%` and `_` match
            themselves rather than acting as wildcards. At most 100 characters.
          schema: { type: string, maxLength: 100 }
          example: wireless
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of matching products.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Products fetched. }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Product' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Products]
      summary: Create a product
      description: '**Admin only.**'
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreate' }
      responses:
        '201':
          description: Product created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      status: { type: integer, example: 201 }
                      message: { type: string, example: Product created. }
                      data: { $ref: '#/components/schemas/Product' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/products/categories:
    get:
      tags: [Products]
      summary: List every category
      description: |
        Each distinct non-empty category in the catalog, sorted. Lets a client offer every
        category filter without loading the whole catalog.
      operationId: listProductCategories
      responses:
        '200':
          description: Category names.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Categories fetched. }
                      data:
                        type: array
                        items: { type: string }
                        example: [Books, Electronics, Furniture]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/products/popular:
    get:
      tags: [Products]
      summary: List the most popular products
      description: |
        The 5 products with the highest total quantity across all order line items.
        Products that have never been ordered are included with a total of 0.
      operationId: listPopularProducts
      responses:
        '200':
          description: Up to 5 products, most ordered first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Most popular products fetched. }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Product' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/products/bulk:
    post:
      tags: [Products]
      summary: Create products in bulk
      description: |
        **Admin only.** The request body is a JSON **array** of products, not an object.
        Validation is all-or-nothing: one bad entry rejects the whole batch with a message
        naming its index, e.g. `products[2].price is required and must be a valid number`.
        Saving is all-or-nothing too: the batch is inserted in one transaction, so if the
        database rejects any product (a value too long or out of range), none are saved.

        The body is capped by `JSON_BODY_LIMIT` (default `1mb`); a larger payload returns
        `413 Request body is too large`.
      operationId: bulkCreateProducts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/ProductCreate' }
      responses:
        '201':
          description: Products created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      status: { type: integer, example: 201 }
                      message: { type: string, example: 2 products created. }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Product' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      summary: Get a product
      operationId: getProduct
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Product fetched. }
                      data: { $ref: '#/components/schemas/Product' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Products]
      summary: Update a product
      description: '**Admin only.** At least one field is required.'
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdate' }
      responses:
        '200':
          description: Product updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Product updated. }
                      data: { $ref: '#/components/schemas/Product' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Products]
      summary: Delete a product
      description: |
        **Admin only.** Cart items and order line items referencing the product cascade.
      operationId: deleteProduct
      responses:
        '200':
          description: Product deleted; the deleted record is returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Product deleted. }
                      data: { $ref: '#/components/schemas/Product' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Orders ──────────────────────────────────────────────────────────────────

  /api/v1/orders:
    get:
      tags: [Orders]
      summary: List your orders
      description: |
        Always scoped to the token user. A `userId` filter naming anyone else returns `403`
        (admins are exempt — but `GET /admin/orders` is the route meant for that).
        Paginated, lowest id first.
      operationId: listOrders
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - name: userId
          in: query
          required: false
          description: Only your own id, unless the token is an admin.
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of matching orders.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Orders fetched. }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Order' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Orders]
      summary: Create an order
      description: |
        Creates an empty order for the token user. `userId` may be sent but must be your own
        id unless the token is an admin. Add line items with `POST /orders/{id}/products`, or
        use `POST /cart/checkout` to do both in one transaction.
      operationId: createOrder
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
                  minimum: 1
                  description: Defaults to the token user.
                status:
                  allOf:
                    - $ref: '#/components/schemas/OrderStatus'
                  default: active
      responses:
        '201':
          description: Order created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      status: { type: integer, example: 201 }
                      message: { type: string, example: Order created. }
                      data: { $ref: '#/components/schemas/Order' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      summary: Get an order
      description: |
        Another user's order is reported as `404`, not `403`, so its existence is not revealed.
      operationId: getOrder
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Order fetched. }
                      data: { $ref: '#/components/schemas/Order' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFoundOrNotYours'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Orders]
      summary: Update an order's status
      operationId: updateOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          description: Order updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Order updated. }
                      data: { $ref: '#/components/schemas/Order' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFoundOrNotYours'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Orders]
      summary: Delete an order
      description: Line items cascade.
      operationId: deleteOrder
      responses:
        '200':
          description: Order deleted; the deleted record is returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Order deleted. }
                      data: { $ref: '#/components/schemas/Order' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFoundOrNotYours'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders/{id}/products:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      summary: List an order's line items
      operationId: listOrderProducts
      responses:
        '200':
          description: The order's line items.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Order products fetched. }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/OrderProduct' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFoundOrNotYours'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Orders]
      summary: Add a line item to an order
      description: |
        Note this returns `200`, not `201`.

        Adding the same product twice creates a second line item rather than merging — the
        merging behaviour lives in the cart (`POST /cart`). An unknown `productId` returns
        `400 Product does not exist`.
      operationId: addOrderProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId: { type: integer, minimum: 1, example: 1 }
                quantity: { type: integer, minimum: 1, example: 2 }
      responses:
        '200':
          description: Line item added.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Product added to order. }
                      data: { $ref: '#/components/schemas/OrderProduct' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFoundOrNotYours'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders/user/{userId}/current:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
    get:
      tags: [Orders]
      summary: List a user's active orders
      description: |
        Your own id only — anyone else's returns `403` (admins are exempt).
        Returns a paginated array, which is empty when there is no active order.
      operationId: listCurrentOrders
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: The user's active orders.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Current order fetched. }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Order' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders/user/{userId}/completed:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
    get:
      tags: [Orders]
      summary: List a user's completed orders
      description: Your own id only — anyone else's returns `403` (admins are exempt). Paginated.
      operationId: listCompletedOrders
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: The user's completed orders.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Completed orders fetched. }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Order' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Cart ────────────────────────────────────────────────────────────────────

  /api/v1/cart:
    get:
      tags: [Cart]
      summary: Get your cart
      description: |
        Cart items joined with their product, oldest first. Each item carries the `product*`
        fields described in `CartItemWithProduct`.
      operationId: getCart
      responses:
        '200':
          description: The token user's cart.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Cart fetched. }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CartItemWithProduct' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Cart]
      summary: Add an item to your cart
      description: |
        Upsert on `(userId, productId, typeId)`: adding a product already in the cart **adds
        to** the existing quantity rather than replacing it, and refreshes `selectedType`,
        `shopId` and `shopName`.

        The response is the bare cart item — the `product*` fields only appear on reads
        (`GET /cart`). An unknown `productId` returns `400 Product does not exist`.
      operationId: addCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemUpsert' }
      responses:
        '201':
          description: Item added or quantity increased.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      status: { type: integer, example: 201 }
                      message: { type: string, example: Item added to cart. }
                      data: { $ref: '#/components/schemas/CartItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Cart]
      summary: Empty your cart
      operationId: clearCart
      responses:
        '200':
          description: Cart emptied. `data` is `null`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              example: { status: 200, message: Cart cleared., data: null }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/cart/checkout:
    post:
      tags: [Cart]
      summary: Check out
      description: |
        Creates an order from the supplied items, marks it `complete` and empties the cart —
        all in one transaction, so a failure leaves neither a half-written order nor a
        cleared cart.

        The items come from the request body, not from the stored cart, so send what you
        intend to buy. An unknown `productId` returns `400 Product does not exist` and leaves
        the cart as it was.
      operationId: checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId: { type: integer, minimum: 1, example: 1 }
                      quantity: { type: integer, minimum: 1, example: 2 }
      responses:
        '201':
          description: Order placed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      status: { type: integer, example: 201 }
                      message: { type: string, example: Checkout successful. }
                      data:
                        type: object
                        properties:
                          order: { $ref: '#/components/schemas/Order' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/cart/{id}:
    parameters:
      - $ref: '#/components/parameters/CartItemId'
    put:
      tags: [Cart]
      summary: Set a cart item's quantity
      description: |
        Replaces the quantity (unlike `POST /cart`, which adds to it). Scoped to your own
        cart — another user's item returns `404`.
      operationId: updateCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, example: 3 }
      responses:
        '200':
          description: Quantity updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Cart item updated. }
                      data: { $ref: '#/components/schemas/CartItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFoundOrNotYours'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Cart]
      summary: Remove a cart item
      description: Scoped to your own cart — another user's item returns `404`.
      operationId: removeCartItem
      responses:
        '200':
          description: Item removed; the removed record is returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Cart item removed. }
                      data: { $ref: '#/components/schemas/CartItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFoundOrNotYours'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Addresses ───────────────────────────────────────────────────────────────

  /api/v1/addresses:
    get:
      tags: [Addresses]
      summary: List your addresses
      operationId: listAddresses
      responses:
        '200':
          description: The token user's addresses.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Addresses fetched. }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Address' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Addresses]
      summary: Add an address
      description: |
        Always created for the token user. Setting `isDefault: true` clears the flag on your
        other addresses in the same transaction.

        An unrecognised `label` falls back to `home` rather than erroring.
      operationId: createAddress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressCreate' }
      responses:
        '201':
          description: Address created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      status: { type: integer, example: 201 }
                      message: { type: string, example: Address created. }
                      data: { $ref: '#/components/schemas/Address' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/addresses/{id}:
    parameters:
      - $ref: '#/components/parameters/AddressId'
    get:
      tags: [Addresses]
      summary: Get an address
      description: Scoped to your own addresses — another user's returns `404`.
      operationId: getAddress
      responses:
        '200':
          description: The address.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Address fetched. }
                      data: { $ref: '#/components/schemas/Address' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFoundOrNotYours'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Addresses]
      summary: Update an address
      description: |
        A partial update — only the fields you send are written. Sending `phone: null` (or an
        empty string) clears the stored phone. Promoting an address with `isDefault: true`
        demotes your others.

        Scoped to your own addresses — another user's returns `404`.
      operationId: updateAddress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressUpdate' }
      responses:
        '200':
          description: Address updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Address updated. }
                      data: { $ref: '#/components/schemas/Address' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFoundOrNotYours'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Addresses]
      summary: Delete an address
      description: Scoped to your own addresses — another user's returns `404`.
      operationId: deleteAddress
      responses:
        '200':
          description: Address deleted; the deleted record is returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Address deleted. }
                      data: { $ref: '#/components/schemas/Address' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFoundOrNotYours'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Admin · Users ───────────────────────────────────────────────────────────

  /api/v1/admin/users:
    get:
      tags: [Admin · Users]
      summary: List users
      description: Paginated, lowest id first.
      operationId: adminListUsers
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of accounts, lowest id first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: Users fetched. }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Admin · Users]
      summary: Create a user
      description: |
        The only route that can create an admin directly — pass `role: admin`.
        Enforces the 8-character password minimum and rejects a duplicate username with `409`.
      operationId: adminCreateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, username, password]
              properties:
                firstName: { type: string, example: Ada }
                lastName: { type: string, example: Lovelace }
                username: { type: string, example: ada }
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: analytical-engine
                role:
                  allOf:
                    - $ref: '#/components/schemas/UserRole'
                  default: customer
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      status: { type: integer, example: 201 }
                      message: { type: string, example: User created. }
                      data: { $ref: '#/components/schemas/User' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '409':
          description: The username is already taken.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              example: { status: 409, message: Username already exists, data: null }
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin · Users]
      summary: Get any user
      description: Includes `recentPurchases` — up to 5 line items from the user's completed orders.
      operationId: adminGetUser
      responses:
        '200':
          description: The account, with recent purchases.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: User fetched. }
                      data: { $ref: '#/components/schemas/UserWithPurchases' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Admin · Users]
      summary: Update any user's profile
      description: |
        Profile fields only — at least one is required. The role has its own route so that
        every privilege change is audited and revokes the user's sessions. A new password
        must be at least 8 characters; a taken username returns `409`.
      operationId: adminUpdateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Account updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: User updated. }
                      data: { $ref: '#/components/schemas/User' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Admin · Users]
      summary: Delete any user
      description: |
        You cannot delete your own account here — that returns `400`. Orders, cart items
        and addresses cascade.
      operationId: adminDeleteUser
      responses:
        '200':
          description: Account deleted; the deleted record is returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: User deleted. }
                      data: { $ref: '#/components/schemas/User' }
        '400':
          description: Invalid id, or an attempt to delete your own account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              example:
                status: 400
                message: You cannot delete your own account through the admin API
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}/role:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Admin · Users]
      summary: Change a user's role
      description: |
        Promotes or demotes an account and revokes all of that user's refresh tokens, so the
        old privilege cannot be renewed. Their current access token still works until it
        expires (15 minutes), but `/admin` routes re-check the role in the database and will
        already refuse it.

        You cannot change your own role — that returns `400`, which keeps the last admin from
        locking themselves out.
      operationId: adminUpdateUserRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/UserRole' }
      responses:
        '200':
          description: Role updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      message: { type: string, example: User role updated. }
                      data: { $ref: '#/components/schemas/User' }
        '400':
          description: Invalid id or role, or an attempt to change your own role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              example: { status: 400, message: You cannot change your own role, data: null }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

